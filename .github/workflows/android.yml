name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitattributes"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  unit-tests:
    name: ${{ matrix.edition }} JVM tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [Full, Lite]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x ./gradlew scripts/download_models.sh

      - name: Run ${{ matrix.edition }} JVM tests
        run: ./gradlew :app:test${{ matrix.edition }}DebugUnitTest --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-${{ matrix.edition }}
          path: |
            app/build/reports/tests/test${{ matrix.edition }}DebugUnitTest/
            app/build/test-results/test${{ matrix.edition }}DebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  android-test-compile:
    name: ${{ matrix.edition }} AndroidTest compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [Full, Lite]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Compile ${{ matrix.edition }} AndroidTest sources
        run: ./gradlew :app:compile${{ matrix.edition }}DebugAndroidTestKotlin --stacktrace

  debug-apk:
    name: ${{ matrix.edition }} Debug APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Full
            editionLower: full
          - edition: Lite
            editionLower: lite

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Assemble ${{ matrix.edition }} Debug APK
        run: ./gradlew :app:assemble${{ matrix.edition }}Debug --stacktrace

      - name: Upload Debug output metadata
        uses: actions/upload-artifact@v4
        with:
          name: debug-metadata-${{ matrix.edition }}
          path: app/build/outputs/apk/${{ matrix.editionLower }}/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 14

  lint:
    name: ${{ matrix.edition }} Debug lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Full
            editionLower: full
          - edition: Lite
            editionLower: lite

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run ${{ matrix.edition }} Debug lint
        run: ./gradlew :app:lint${{ matrix.edition }}Debug -x :opencv:lintDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ matrix.edition }}
          path: app/build/reports/lint-results-${{ matrix.editionLower }}Debug.*
          if-no-files-found: warn
          retention-days: 14

  release-evidence:
    name: Full/Lite Release, R8, AAB and evidence
    runs-on: ubuntu-latest
    needs: [unit-tests, android-test-compile, debug-apk, lint]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x ./gradlew scripts/download_models.sh

      - name: Validate model download script
        run: bash -n scripts/download_models.sh

      - name: Download edition-scoped release models
        run: ./scripts/download_models.sh

      - name: Assemble Full/Lite Release APK candidates
        run: >-
          ./gradlew
          "-Dorg.gradle.jvmargs=-Xmx12288m -Dfile.encoding=UTF-8"
          --no-daemon
          --max-workers=1
          :app:assembleFullRelease
          :app:assembleLiteRelease
          --stacktrace

      - name: Bundle Lite Release candidate
        run: >-
          ./gradlew
          "-Dorg.gradle.jvmargs=-Xmx12288m -Dfile.encoding=UTF-8"
          --no-daemon
          --max-workers=1
          :app:bundleLiteRelease
          --stacktrace

      - name: Bundle Full Release candidate
        run: >-
          ./gradlew
          "-Dorg.gradle.jvmargs=-Xmx12288m -Dfile.encoding=UTF-8"
          --no-daemon
          --max-workers=1
          :app:bundleFullRelease
          --stacktrace

      - name: Guard Room schema export drift
        run: git diff --exit-code -- app/schemas/com.renyxin.localalbum.data.db.AppDatabase/

      - name: Generate runtimeClasspath reports
        shell: pwsh
        run: |
          $output = "build/reports/lite-release/runtime-classpath"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $configs = @(
            "fullDebugRuntimeClasspath",
            "liteDebugRuntimeClasspath",
            "fullReleaseRuntimeClasspath",
            "liteReleaseRuntimeClasspath"
          )
          foreach ($config in $configs) {
            $name = $config.Replace("RuntimeClasspath", "-runtimeClasspath") + ".txt"
            & ./gradlew :app:dependencies --configuration $config --no-daemon 2>&1 |
              Set-Content -Path (Join-Path $output $name) -Encoding utf8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Generate SBOM and NOTICE inventory
        shell: pwsh
        run: ./scripts/Generate-DependencyComplianceEvidence.ps1

      - name: Generate release evidence and enforce artifact-purpose/DEX guards
        shell: pwsh
        run: ./scripts/Generate-LiteReleaseEvidence.ps1 -RequireArtifacts -ReleaseOnly

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-lite-release-evidence
          path: |
            build/reports/lite-release/
            app/build/outputs/apk/full/release/output-metadata.json
            app/build/outputs/apk/lite/release/output-metadata.json
            app/build/outputs/mapping/fullRelease/
            app/build/outputs/mapping/liteRelease/
          if-no-files-found: warn
          retention-days: 30
