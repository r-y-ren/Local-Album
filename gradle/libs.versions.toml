# Version Catalog — Phase 2 依赖审计迁移（plans/phase2-dependency-audit.md §4/§5）
# 版本策略：与迁移前 build.gradle.kts 中的现状完全一致，不夹带任何升级。
# 已删除的无用依赖（runtime-livedata/espresso-core/ui-test-junit4/ui-test-manifest）不收录。
# 注意：plugins DSL 迁移不在本次范围，[plugins] 节仅作声明备用，根 buildscript classpath 保持原样。

[versions]
# ── 构建插件（与 Kotlin 严格配对，升级必须联动）──
agp = "8.13.2"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
composeCompiler = "1.5.14"          # ↔ kotlin 1.9.24（composeOptions.kotlinCompilerExtensionVersion）
foojayResolver = "1.0.0"

# ── AndroidX / Compose ──
composeBom = "2024.09.02"
material3 = "1.3.0"                 # 现状为显式 1.3.0（BOM 2024.09.02 内含同版本）；保留显式以完全复刻现状
coreKtx = "1.13.1"
lifecycle = "2.8.5"
activityCompose = "1.9.2"
googleMaterial = "1.14.0"           # com.google.android.material（XML 主题 Theme.Material3 依赖，必须保留）
datastore = "1.1.1"
exifinterface = "1.3.7"
media3 = "1.4.1"
room = "2.6.1"
work = "2.9.1"
paging = "3.3.2"
annotation = "1.8.0"                # opencv 模块用

# ── Kotlin 生态 ──
coroutines = "1.8.1"

# ── 第三方 ──
coil = "2.6.0"

# ── ML Kit / ML 运行时（三运行时并存是设计使然，均已证实使用）──
mlkitTextRecognition = "16.0.1"
mlkitFaceDetection = "16.1.7"
tensorflowLite = "2.14.0"
onnxRuntime = "1.19.2"
pytorchMobile = "1.13.1"

# ── 其他 / 测试 ──
desugarJdkLibs = "2.0.4"
junit = "4.13.2"
json = "20240303"
mockito = "5.5.0"
androidxTestExtJunit = "1.2.1"
# 仅 JVM 单测使用：桌面版 OpenCV，用于与纯 Kotlin 对齐数学对拍验证等价性
opencvDesktop = "4.9.0-0"

[libraries]
# ── AndroidX 基础 ──
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ── Compose（除 material3 外均无版本，由 BOM 接管）──
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "googleMaterial" }

# ── 数据 / 后台 ──
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-paging-runtime-ktx = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# ── 媒体 ──
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# ── Kotlin / 协程 ──
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

# ── 第三方图像 ──
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }

# ── ML Kit ──
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-chinese = { group = "com.google.mlkit", name = "text-recognition-chinese", version.ref = "mlkitTextRecognition" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFaceDetection" }

# ── ML 运行时 ──
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxRuntime" }
pytorch-android-lite = { group = "org.pytorch", name = "pytorch_android_lite", version.ref = "pytorchMobile" }

# ── desugar / opencv 模块 ──
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }

# ── 测试 ──
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
opencv-desktop = { group = "org.openpnp", name = "opencv", version.ref = "opencvDesktop" }

[bundles]
# 语义与迁移前逐条 add(...) 声明完全一致，仅为便利分组
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
]
media3 = [
    "androidx-media3-exoplayer",
    "androidx-media3-ui",
    "androidx-media3-common",
]
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
    "androidx-room-paging",
]
paging = [
    "androidx-paging-runtime-ktx",
    "androidx-paging-compose",
]
coil = [
    "coil-compose",
    "coil-video",
]

[plugins]
# 本次不做 plugins DSL 迁移（根 buildscript classpath workaround 保持原样，见根 build.gradle.kts 注释），
# 以下条目仅作声明备用。
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolver" }
