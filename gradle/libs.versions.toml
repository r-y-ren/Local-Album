# Version Catalog — Phase 2 依赖审计迁移（plans/phase2-dependency-audit.md §4/§5）
# 版本策略：与迁移前 build.gradle.kts 中的现状完全一致，不夹带任何升级。
# 已删除的无用依赖（runtime-livedata/espresso-core/ui-test-junit4/ui-test-manifest）不收录。
# 2026-10 起根脚本回归 plugins DSL（KGP 2.2 下不再需要 buildscript classpath 绕行）。

[versions]
# ── 构建插件（与 Kotlin 严格配对，升级必须联动）──
# 2026-10 工具链升级：Kotlin 1.9.24 → 2.2.21（K2 + Compose Compiler Gradle 插件），
# KSP 走 2.0.x（KSP2）；composeCompiler 独立版本随 Kotlin 1.9 时代终结一并移除。
agp = "9.5.0"
kotlin = "2.2.21"
# AGP 9 内置 Kotlin 下 KSP 走独立版本线（不再与 Kotlin 版本配对）；旧线 2.2.21-2.0.5 显式不兼容内置 Kotlin
ksp = "2.3.12"
foojayResolver = "1.0.0"

# ── AndroidX / Compose ──
composeBom = "2026.09.00"          # ui 1.12.x，要求 compileSdk 37
# material3 随 BOM（升级后显式固定版本与 BOM 内版本漂移风险大，回归 BOM 接管）
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
googleMaterial = "1.14.0"           # com.google.android.material（XML 主题 Theme.Material3 依赖，必须保留）
datastore = "1.1.1"
exifinterface = "1.3.7"
media3 = "1.4.1"
room = "2.8.5"                # 2.7+ 全面支持 KSP2/Kotlin 2.x
work = "2.9.1"
paging = "3.3.2"
annotation = "1.8.0"                # opencv 模块用

# ── Kotlin 生态 ──
coroutines = "1.11.0"

# ── 第三方 ──
coil = "2.7.0"
telephoto = "0.19.0"           # 需 Kotlin≥2.1 消费；0.14 为 Kotlin 1.9 上限

# ── ML Kit / ML 运行时（三运行时并存是设计使然，均已证实使用）──
mlkitTextRecognition = "16.0.1"
mlkitFaceDetection = "16.1.7"
tensorflowLite = "2.17.0"           # 2.16+ 修复与 -api AAR 的 namespace 重复（AGP 9 强制唯一）
onnxRuntime = "1.19.2"
pytorchMobile = "1.13.1"

# ── 其他 / 测试 ──
desugarJdkLibs = "2.1.5"             # AGP 9 工具链配套（2.0.4 曾致 release 启动 VerifyError）
junit = "4.13.2"
json = "20240303"
mockito = "5.5.0"
androidxTestExtJunit = "1.2.1"
# 仅 JVM 单测使用：桌面版 OpenCV，用于与纯 Kotlin 对齐数学对拍验证等价性
opencvDesktop = "4.9.0-0"

[libraries]
# ── AndroidX 基础 ──
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ── Compose（全部由 BOM 接管）──
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "googleMaterial" }

# ── 数据 / 后台 ──
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-paging-runtime-ktx = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# ── 媒体 ──
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# ── Kotlin / 协程 ──
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

# ── 第三方图像 ──
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
telephoto-zoomable = { group = "me.saket.telephoto", name = "zoomable", version.ref = "telephoto" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }

# ── ML Kit ──
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-chinese = { group = "com.google.mlkit", name = "text-recognition-chinese", version.ref = "mlkitTextRecognition" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFaceDetection" }

# ── ML 运行时 ──
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxRuntime" }
pytorch-android-lite = { group = "org.pytorch", name = "pytorch_android_lite", version.ref = "pytorchMobile" }

# ── desugar / opencv 模块 ──
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }

# ── 测试 ──
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
opencv-desktop = { group = "org.openpnp", name = "opencv", version.ref = "opencvDesktop" }

[bundles]
# 语义与迁移前逐条 add(...) 声明完全一致，仅为便利分组
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
]
media3 = [
    "androidx-media3-exoplayer",
    "androidx-media3-ui",
    "androidx-media3-common",
]
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
    "androidx-room-paging",
]
paging = [
    "androidx-paging-runtime-ktx",
    "androidx-paging-compose",
]
coil = [
    "coil-compose",
    "coil-video",
]

[plugins]
# 2026-10 工具链升级：AGP 9.5（内置 Kotlin，android.builtInKotlin 默认开启）。
# kotlin-android 别名仅用于把 KGP 放上插件 classpath 供 AGP 识别版本——
# 模块脚本不再 apply 它（AGP 9 下与 newDsl 不兼容）。
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolver" }
